<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="50%" stop-color="#091228" />
      <stop offset="100%" stop-color="#0d1b3e" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="shieldInnerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b1736" />
      <stop offset="100%" stop-color="#040817" />
    </linearGradient>
    <linearGradient id="coreGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rectangle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Subtle circuit lines -->
  <g stroke="#06b6d4" stroke-opacity="0.25" stroke-width="2" fill="none">
    <path d="M 64 160 L 140 160 L 180 200" />
    <circle cx="64" cy="160" r="4" fill="#06b6d4" fill-opacity="0.4" />
    <path d="M 448 160 L 372 160 L 332 200" />
    <circle cx="448" cy="160" r="4" fill="#06b6d4" fill-opacity="0.4" />
    <path d="M 64 352 L 140 352 L 190 302" />
    <circle cx="64" cy="352" r="4" fill="#06b6d4" fill-opacity="0.4" />
    <path d="M 448 352 L 372 352 L 322 302" />
    <circle cx="448" cy="352" r="4" fill="#06b6d4" fill-opacity="0.4" />
  </g>

  <!-- Outer Glowing Shield Contour -->
  <path
    d="M 256 70
       L 396 122
       C 396 260 340 376 256 432
       C 172 376 116 260 116 122
       Z"
    fill="url(#shieldGrad)"
    filter="url(#glow)"
    opacity="0.4"
  />

  <!-- Main Shield Body -->
  <path
    d="M 256 80
       L 386 128
       C 386 252 334 362 256 414
       C 178 362 126 252 126 128
       Z"
    fill="url(#shieldGrad)"
  />

  <!-- Inner Dark Shield Cavity -->
  <path
    d="M 256 98
       L 368 140
       C 368 244 322 342 256 390
       C 190 342 144 244 144 140
       Z"
    fill="url(#shieldInnerGrad)"
    stroke="#38bdf8"
    stroke-opacity="0.3"
    stroke-width="2"
  />

  <!-- Central Security Emblem: Padlock + Checkmark -->
  <!-- Shackle -->
  <path
    d="M 216 230
       L 216 195
       C 216 172.9 233.9 155 256 155
       C 278.1 155 296 172.9 296 195
       L 296 230"
    fill="none"
    stroke="url(#coreGlow)"
    stroke-width="16"
    stroke-linecap="round"
  />

  <!-- Padlock Body -->
  <rect
    x="196"
    y="226"
    width="120"
    height="96"
    rx="20"
    fill="url(#coreGlow)"
  />

  <!-- Lock Core Keyhole / Checkmark -->
  <path
    d="M 234 274
       L 249 289
       L 278 259"
    fill="none"
    stroke="#040817"
    stroke-width="10"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- High-tech Node Dots -->
  <circle cx="256" cy="356" r="6" fill="#38bdf8" />
  <circle cx="236" cy="356" r="3" fill="#38bdf8" opacity="0.6" />
  <circle cx="276" cy="356" r="3" fill="#38bdf8" opacity="0.6" />
</svg>
